name: Deploy Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            site/package-lock.json
            slides/package-lock.json

      - name: Install Antora dependencies
        run: npm ci
        working-directory: site

      - name: Build Antora site
        run: npm run build
        working-directory: site

      - name: Install slide dependencies
        run: npm ci
        working-directory: slides

      - name: Build slides
        run: npm run build
        working-directory: slides

      - name: Assemble combined site
        run: |
          mkdir -p _site
          cp -r site/build/site _site/workshop
          cp -r slides/build _site/slides
          cp landing/index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive">
  <defs>
    <marker id="ah-gray" markerWidth="12" markerHeight="12" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ah-orange" markerWidth="12" markerHeight="12" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8820c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="64" text-anchor="middle" font-size="44" fill="#222">Workshop Architecture</text>

  <!-- ===================== boundaries (drawn first) ===================== -->
  <!-- AWS Cloud boundary -->
  <rect x="60" y="156" width="1480" height="492" rx="20" fill="none" stroke="#ff9900" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="80" y="184" font-size="20" fill="#ff9900">AWS Cloud (us-east-1)</text>

  <!-- SageMaker Studio boundary -->
  <rect x="110" y="200" width="1380" height="278" rx="18" fill="none" stroke="#4a90e2" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="130" y="228" font-size="20" fill="#2f6fd0">Amazon SageMaker Studio</text>

  <!-- ===================== edges (drawn before nodes) ===================== -->
  <!-- User Question -> Strands Agent -->
  <line x1="800" y1="138" x2="800" y2="240" stroke="#555" stroke-width="2.5" marker-end="url(#ah-gray)"/>

  <!-- Agent -> three tools -->
  <line x1="650" y1="322" x2="382" y2="373" stroke="#555" stroke-width="2.5" marker-end="url(#ah-gray)"/>
  <line x1="800" y1="322" x2="800" y2="373" stroke="#555" stroke-width="2.5" marker-end="url(#ah-gray)"/>
  <line x1="950" y1="322" x2="1218" y2="373" stroke="#555" stroke-width="2.5" marker-end="url(#ah-gray)"/>
  <text x="800" y="352" text-anchor="middle" font-size="18" fill="#555">agent picks one tool</text>

  <!-- Vector Search -> Bedrock (embed query) -->
  <line x1="360" y1="470" x2="455" y2="520" stroke="#555" stroke-width="2.5" marker-end="url(#ah-gray)"/>
  <text x="360" y="502" text-anchor="middle" font-size="18" fill="#555">embed query</text>

  <!-- Graph-Enriched -> Bedrock (embed query) -->
  <line x1="800" y1="470" x2="700" y2="520" stroke="#555" stroke-width="2.5" marker-end="url(#ah-gray)"/>
  <text x="800" y="502" text-anchor="middle" font-size="18" fill="#555">embed query</text>

  <!-- Text2Cypher -> Neo4j directly (raw Cypher, no embedding) -->
  <line x1="1240" y1="470" x2="1240" y2="674" stroke="#555" stroke-width="2.5" marker-end="url(#ah-gray)"/>
  <text x="1240" y="568" text-anchor="middle" font-size="18" fill="#555">raw Cypher (no embedding)</text>

  <!-- Bedrock -> Neo4j (query vector) -->
  <line x1="600" y1="617" x2="600" y2="674" stroke="#555" stroke-width="2.5" marker-end="url(#ah-gray)"/>
  <text x="600" y="654" text-anchor="middle" font-size="18" fill="#555">query vector</text>

  <!-- Neo4j -> Grounded answer -->
  <line x1="800" y1="800" x2="800" y2="822" stroke="#555" stroke-width="2.5" marker-end="url(#ah-gray)"/>

  <!-- ===================== nodes ===================== -->
  <!-- User Question (blue) -->
  <rect x="640" y="86" width="320" height="52" rx="16" fill="#dbe4ff" stroke="#1971c2" stroke-width="2.5"/>
  <text x="800" y="120" text-anchor="middle" font-size="26" fill="#333">User Question</text>

  <!-- Strands Agent (purple) -->
  <rect x="570" y="242" width="460" height="80" rx="16" fill="#f4e2fb" stroke="#9b30c9" stroke-width="3"/>
  <text x="800" y="276" text-anchor="middle" font-size="26" fill="#333">Strands Agent</text>
  <text x="800" y="306" text-anchor="middle" font-size="20" fill="#333">Claude Sonnet 4.5 (BedrockModel)</text>

  <!-- Tool 1: Vector Search (teal) -->
  <rect x="170" y="375" width="380" height="95" rx="16" fill="#e8fbf8" stroke="#2bb3a3" stroke-width="2.5"/>
  <text x="360" y="413" text-anchor="middle" font-size="24" fill="#333">Vector Search</text>
  <text x="360" y="444" text-anchor="middle" font-size="18" fill="#333">VectorRetriever (Lab 3/4)</text>

  <!-- Tool 2: Graph-Enriched (teal) -->
  <rect x="610" y="375" width="380" height="95" rx="16" fill="#e8fbf8" stroke="#2bb3a3" stroke-width="2.5"/>
  <text x="800" y="413" text-anchor="middle" font-size="24" fill="#333">Graph-Enriched</text>
  <text x="800" y="444" text-anchor="middle" font-size="18" fill="#333">VectorCypherRetriever (Lab 3/4)</text>

  <!-- Tool 3: Text2Cypher (teal) -->
  <rect x="1050" y="375" width="380" height="95" rx="16" fill="#e8fbf8" stroke="#2bb3a3" stroke-width="2.5"/>
  <text x="1240" y="413" text-anchor="middle" font-size="24" fill="#333">Text2Cypher</text>
  <text x="1240" y="444" text-anchor="middle" font-size="18" fill="#333">LLM writes Cypher (Lab 6, MCP)</text>

  <!-- Amazon Bedrock (amber) -->
  <rect x="380" y="522" width="440" height="95" rx="16" fill="#ffe8cc" stroke="#e8820c" stroke-width="3"/>
  <text x="600" y="560" text-anchor="middle" font-size="26" fill="#333">Amazon Bedrock</text>
  <text x="600" y="592" text-anchor="middle" font-size="18" fill="#333">Titan Text Embeddings V2 (1024-dim)</text>

  <!-- Neo4j Aura (green) -->
  <rect x="300" y="678" width="1000" height="122" rx="16" fill="#d3f9d8" stroke="#2f9e44" stroke-width="3"/>
  <text x="800" y="716" text-anchor="middle" font-size="28" fill="#333">Neo4j Aura</text>
  <text x="800" y="750" text-anchor="middle" font-size="20" fill="#333">chunkEmbeddings vector index + graph</text>
  <text x="800" y="782" text-anchor="middle" font-size="18" fill="#333">Company / Product / RiskFactor / AssetManager (SEC 10-K)</text>

  <!-- Grounded answer (blue) -->
  <rect x="650" y="822" width="300" height="52" rx="16" fill="#dbe4ff" stroke="#1971c2" stroke-width="2.5"/>
  <text x="800" y="856" text-anchor="middle" font-size="26" fill="#333">Grounded answer</text>
</svg>

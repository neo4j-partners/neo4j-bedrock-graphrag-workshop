<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Title -->
  <text x="466" y="50" text-anchor="middle" font-size="24" font-weight="600" fill="#1e293b" letter-spacing="0.3">Strands Agent Architecture</text>

  <!-- ===================== edges (drawn before nodes) ===================== -->
  <g stroke="#94a3b8" stroke-width="1.75" fill="none">
    <!-- User Query -> AI Agent -->
    <line x1="466" y1="114" x2="466" y2="144" marker-end="url(#ah)"/>
    <!-- AI Agent -> Tool Selection -->
    <line x1="466" y1="192" x2="466" y2="216" marker-end="url(#ah)"/>
    <!-- Tool Selection -> three tools -->
    <path d="M416,264 C360,282 320,278 290,292" marker-end="url(#ah)"/>
    <line x1="466" y1="264" x2="466" y2="292" marker-end="url(#ah)"/>
    <path d="M516,264 C572,282 612,278 642,292" marker-end="url(#ah)"/>
    <!-- three tools -> Neo4j Aura -->
    <path d="M260,350 C300,372 380,376 418,388" marker-end="url(#ah)"/>
    <line x1="466" y1="350" x2="466" y2="388" marker-end="url(#ah)"/>
    <path d="M672,350 C632,372 552,376 514,388" marker-end="url(#ah)"/>
    <!-- Neo4j Aura -> Knowledge Graph -->
    <line x1="466" y1="434" x2="466" y2="462" marker-end="url(#ah)"/>
  </g>

  <!-- ===================== nodes ===================== -->
  <!-- User Query (blue) -->
  <rect x="376" y="70" width="180" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="466" y="97" text-anchor="middle" font-size="16" font-weight="600" fill="#1d4ed8">User Query</text>

  <!-- AI Agent (purple) -->
  <rect x="356" y="146" width="220" height="46" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="466" y="166" text-anchor="middle" font-size="15" font-weight="600" fill="#6d28d9">AI Agent</text>
  <text x="466" y="184" text-anchor="middle" font-size="12.5" fill="#7c3aed">Strands + Claude</text>

  <!-- Tool Selection (amber) -->
  <rect x="376" y="218" width="180" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="466" y="246" text-anchor="middle" font-size="16" font-weight="600" fill="#b45309">Tool Selection</text>

  <!-- Tool 1: Vector Search (cyan) -->
  <rect x="150" y="296" width="220" height="54" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="260" y="320" text-anchor="middle" font-size="14.5" font-weight="600" fill="#0e7490">Vector Search</text>
  <text x="260" y="338" text-anchor="middle" font-size="11.5" fill="#0891b2">Titan Text Embeddings V2</text>

  <!-- Tool 2: Text2Cypher (cyan) -->
  <rect x="376" y="296" width="180" height="54" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="466" y="320" text-anchor="middle" font-size="14.5" font-weight="600" fill="#0e7490">Text2Cypher</text>
  <text x="466" y="338" text-anchor="middle" font-size="12.5" fill="#0891b2">Claude LLM</text>

  <!-- Tool 3: Cypher Template (cyan) -->
  <rect x="562" y="296" width="220" height="54" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="672" y="320" text-anchor="middle" font-size="14.5" font-weight="600" fill="#0e7490">Cypher Template</text>
  <text x="672" y="338" text-anchor="middle" font-size="12.5" fill="#0891b2">Direct Query</text>

  <!-- Neo4j Aura (green) -->
  <rect x="366" y="390" width="200" height="44" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="466" y="417" text-anchor="middle" font-size="16" font-weight="600" fill="#15803d">Neo4j Aura</text>

  <!-- SEC 10-K Knowledge Graph (green) -->
  <rect x="296" y="464" width="340" height="54" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="466" y="488" text-anchor="middle" font-size="14.5" font-weight="600" fill="#15803d">SEC 10-K Knowledge Graph</text>
  <text x="466" y="506" text-anchor="middle" font-size="12" fill="#16a34a">Companies &#183; Products &#183; Risk Factors &#183; Ownership</text>

  <!-- ===================== Lab 5 memory (sidecar at agent layer) ===================== -->
  <!-- memory persists to the same Neo4j Aura (dashed) -->
  <path d="M815,197 C815,320 812,392 700,406 C650,414 610,413 568,412" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#ah)"/>
  <text x="836" y="332" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(90 836 332)">persists</text>

  <!-- recall / store between agent and memory (bidirectional) -->
  <g stroke="#94a3b8" stroke-width="1.75" fill="none">
    <line x1="702" y1="158" x2="578" y2="158" marker-end="url(#ah)"/>
    <line x1="576" y1="180" x2="700" y2="180" marker-end="url(#ah)"/>
  </g>
  <text x="639" y="151" text-anchor="middle" font-size="11" fill="#64748b">recall</text>
  <text x="639" y="197" text-anchor="middle" font-size="11" fill="#64748b">store</text>

  <!-- Conversation Memory node (purple, agent layer) -->
  <rect x="700" y="142" width="230" height="54" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="815" y="166" text-anchor="middle" font-size="14.5" font-weight="600" fill="#6d28d9">Conversation Memory</text>
  <text x="815" y="184" text-anchor="middle" font-size="12" fill="#7c3aed">neo4j-agent-memory (Lab 5)</text>
</svg>

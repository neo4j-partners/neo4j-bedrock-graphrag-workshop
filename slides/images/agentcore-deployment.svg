<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ah-gray" markerWidth="12" markerHeight="12" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="ah-orange" markerWidth="12" markerHeight="12" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#101828" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="64" text-anchor="middle" font-size="44" font-weight="600" letter-spacing="0.3" fill="#1e293b">Lab 4: Deploy to AgentCore Runtime</text>

  <!-- ===================== SageMaker Studio boundary ===================== -->
  <rect x="40" y="120" width="420" height="340" rx="18" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="58" y="152" font-size="20" font-weight="600" fill="#1d4ed8">Amazon SageMaker Studio</text>

  <!-- Notebook / code box -->
  <rect x="55" y="200" width="350" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="248" text-anchor="middle" font-size="21" font-weight="600" fill="#1d4ed8">02_deploy_to_agentcore.ipynb</text>
  <text x="230" y="282" text-anchor="middle" font-size="17" fill="#3b82f6">bedrock-agentcore-starter-toolkit</text>
  <text x="230" y="312" text-anchor="middle" font-size="16" fill="#3b82f6">agentcore deploy (direct_code_deploy)</text>

  <!-- note under notebook -->
  <text x="56" y="372" font-size="16" fill="#94a3b8">bundles agentcore_deploy/:</text>
  <text x="56" y="395" font-size="16" fill="#94a3b8">agent.py, graphrag_agent.py,</text>
  <text x="56" y="418" font-size="16" fill="#94a3b8">pyproject.toml</text>

  <!-- ===================== AWS Cloud boundary ===================== -->
  <rect x="500" y="120" width="1060" height="490" rx="18" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="520" y="152" font-size="20" font-weight="600" fill="#b45309">AWS Cloud (us-east-1)</text>

  <!-- ===================== deploy-step arrows (orange) ===================== -->
  <!-- 1. notebook -> S3 -->
  <line x1="407" y1="262" x2="556" y2="256" stroke="#f59e0b" stroke-width="2.25" marker-end="url(#ah-orange)"/>
  <text x="480" y="178" text-anchor="middle" font-size="16" fill="#b45309">1. zip + upload code</text>
  <!-- 2. S3 -> Runtime -->
  <line x1="762" y1="255" x2="876" y2="250" stroke="#f59e0b" stroke-width="2.25" marker-end="url(#ah-orange)"/>
  <text x="815" y="178" text-anchor="middle" font-size="16" fill="#b45309">2. provision runtime</text>

  <!-- ===================== gray arrows ===================== -->
  <!-- Runtime -> Bedrock -->
  <line x1="1232" y1="256" x2="1326" y2="260" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="1280" y="178" text-anchor="middle" font-size="16" fill="#64748b">model + embed calls</text>
  <!-- Runtime -> Neo4j Aura (exits AWS services boundary) -->
  <line x1="1185" y1="470" x2="1385" y2="678" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="1330" y="560" text-anchor="middle" font-size="18" fill="#64748b">Cypher + vector</text>
  <!-- client -> Runtime -->
  <line x1="462" y1="700" x2="878" y2="466" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="640" y="512" text-anchor="middle" font-size="17" fill="#64748b">3. invoke over REST</text>
  <text x="640" y="534" text-anchor="middle" font-size="17" fill="#64748b">(agentRuntimeArn, prompt)</text>

  <!-- ===================== nodes ===================== -->
  <!-- Amazon S3 -->
  <rect x="560" y="210" width="200" height="95" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="250" text-anchor="middle" font-size="22" font-weight="600" fill="#15803d">Amazon S3</text>
  <text x="660" y="282" text-anchor="middle" font-size="18" fill="#16a34a">code bundle (.zip)</text>

  <!-- Amazon Bedrock AgentCore Runtime -->
  <rect x="880" y="200" width="350" height="270" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="238" text-anchor="middle" font-size="21" font-weight="600" fill="#b45309">Amazon Bedrock</text>
  <text x="1055" y="266" text-anchor="middle" font-size="21" font-weight="600" fill="#b45309">AgentCore Runtime</text>
  <line x1="910" y1="284" x2="1200" y2="284" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1055" y="318" text-anchor="middle" font-size="18" fill="#d97706">isolated microVM per session</text>
  <text x="1055" y="350" text-anchor="middle" font-size="18" fill="#d97706">Python 3.13 / arm64</text>
  <text x="1055" y="382" text-anchor="middle" font-size="18" fill="#d97706">retrievers built once (warm)</text>
  <text x="1055" y="414" text-anchor="middle" font-size="18" fill="#d97706">fresh Agent per request</text>

  <!-- Amazon Bedrock (models) -->
  <rect x="1330" y="210" width="210" height="120" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1435" y="250" text-anchor="middle" font-size="21" font-weight="600" fill="#6d28d9">Amazon Bedrock</text>
  <text x="1435" y="282" text-anchor="middle" font-size="17" fill="#7c3aed">Claude Sonnet 4.6 +</text>
  <text x="1435" y="306" text-anchor="middle" font-size="15" fill="#7c3aed">Titan Text Embeddings V2</text>

  <!-- IAM note -->
  <rect x="820" y="500" width="380" height="85" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="1010" y="536" text-anchor="middle" font-size="17" font-weight="600" fill="#475467">IAM: BedrockAgentCoreLabDeployPolicy</text>
  <text x="1010" y="562" text-anchor="middle" font-size="16" fill="#64748b">execution role auto-created</text>

  <!-- Neo4j Aura (outside AWS services boundary) -->
  <rect x="1320" y="682" width="220" height="115" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2" filter="url(#shadow)"/>
  <text x="1430" y="728" text-anchor="middle" font-size="22" font-weight="600" fill="#0e7490">Neo4j Aura</text>
  <text x="1430" y="762" text-anchor="middle" font-size="18" fill="#0891b2">vector + graph</text>

  <!-- Client invocation box -->
  <rect x="40" y="680" width="420" height="120" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="720" text-anchor="middle" font-size="20" font-weight="600" fill="#1d4ed8">client</text>
  <text x="250" y="752" text-anchor="middle" font-size="18" fill="#3b82f6">agentcore invoke</text>
  <text x="250" y="782" text-anchor="middle" font-size="18" fill="#3b82f6">boto3 invoke_agent_runtime</text>
</svg>

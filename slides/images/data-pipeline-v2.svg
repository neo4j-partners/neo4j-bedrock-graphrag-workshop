<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="dp-blue" markerWidth="12" markerHeight="12" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="dp-orange" markerWidth="12" markerHeight="12" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="dp-green" markerWidth="12" markerHeight="12" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
    <marker id="dp-teal" markerWidth="12" markerHeight="12" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#06b6d4"/>
    </marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#101828" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1500" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="58" font-size="42" font-weight="600" letter-spacing="0.3" fill="#1e293b">Data Pipeline: AWS Lakehouse to Neo4j</text>

  <!-- ===== Group A: Amazon S3 Tables ===== -->
  <rect x="40" y="100" width="310" height="480" rx="18" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="195" y="140" text-anchor="middle" font-size="26" font-weight="600" fill="#4338ca">Amazon S3 Tables</text>
  <text x="195" y="168" text-anchor="middle" font-size="18" fill="#6366f1">(Apache Iceberg)</text>

  <rect x="70" y="195" width="250" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="195" y="240" text-anchor="middle" font-size="24" font-weight="600" fill="#1d4ed8">CSV Seed Data</text>
  <text x="195" y="288" text-anchor="middle" font-size="18" fill="#3b82f6">companies, products,</text>
  <text x="195" y="314" text-anchor="middle" font-size="18" fill="#3b82f6">risk factors, ownership</text>

  <rect x="70" y="420" width="250" height="100" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="195" y="478" text-anchor="middle" font-size="24" font-weight="600" fill="#b45309">10-K Filing Text</text>

  <!-- ===== Group B: Amazon SageMaker ===== -->
  <rect x="430" y="100" width="330" height="480" rx="18" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="595" y="150" text-anchor="middle" font-size="26" font-weight="600" fill="#4338ca">Amazon SageMaker</text>

  <rect x="465" y="200" width="260" height="140" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="595" y="262" text-anchor="middle" font-size="24" font-weight="600" fill="#1d4ed8">Load Nodes &amp;</text>
  <text x="595" y="292" text-anchor="middle" font-size="24" font-weight="600" fill="#1d4ed8">Relationships</text>

  <rect x="465" y="390" width="260" height="155" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="595" y="440" text-anchor="middle" font-size="24" font-weight="600" fill="#b45309">Chunk + Embed</text>
  <text x="595" y="488" text-anchor="middle" font-size="18" fill="#d97706">FixedSizeSplitter +</text>
  <text x="595" y="514" text-anchor="middle" font-size="16" fill="#d97706">Titan Text Embeddings V2</text>

  <!-- ===== flow arrows into SageMaker ===== -->
  <line x1="322" y1="270" x2="461" y2="270" stroke="#3b82f6" stroke-width="2.25" marker-end="url(#dp-blue)"/>
  <line x1="322" y1="470" x2="461" y2="467" stroke="#f59e0b" stroke-width="2.25" marker-end="url(#dp-orange)"/>

  <!-- ===== Neo4j Aura hero ===== -->
  <rect x="885" y="245" width="255" height="130" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="1012" y="325" text-anchor="middle" font-size="34" font-weight="600" fill="#15803d">Neo4j Aura</text>

  <!-- SageMaker -> Neo4j -->
  <line x1="727" y1="270" x2="881" y2="295" stroke="#3b82f6" stroke-width="2.25" marker-end="url(#dp-blue)"/>
  <line x1="727" y1="465" x2="881" y2="340" stroke="#f59e0b" stroke-width="2.25" marker-end="url(#dp-orange)"/>

  <!-- ===== outputs ===== -->
  <rect x="815" y="450" width="185" height="120" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="907" y="502" text-anchor="middle" font-size="21" font-weight="600" fill="#15803d">Nodes &amp;</text>
  <text x="907" y="528" text-anchor="middle" font-size="21" font-weight="600" fill="#15803d">Relationships</text>

  <rect x="1025" y="450" width="195" height="120" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="1122" y="492" text-anchor="middle" font-size="21" font-weight="600" fill="#0e7490">Vector Index</text>
  <text x="1122" y="522" text-anchor="middle" font-size="17" fill="#0891b2">chunkEmbeddings</text>
  <text x="1122" y="544" text-anchor="middle" font-size="17" fill="#0891b2">1024 dims</text>

  <rect x="1245" y="450" width="215" height="120" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="1352" y="492" text-anchor="middle" font-size="21" font-weight="600" fill="#0e7490">Fulltext Indexes</text>
  <text x="1352" y="522" text-anchor="middle" font-size="17" fill="#0891b2">search_chunks</text>
  <text x="1352" y="544" text-anchor="middle" font-size="17" fill="#0891b2">search_entities</text>

  <!-- Neo4j -> outputs -->
  <line x1="990" y1="378" x2="920" y2="446" stroke="#22c55e" stroke-width="2" marker-end="url(#dp-green)"/>
  <line x1="1030" y1="378" x2="1105" y2="446" stroke="#06b6d4" stroke-width="2" marker-end="url(#dp-teal)"/>
  <line x1="1075" y1="375" x2="1320" y2="446" stroke="#06b6d4" stroke-width="2" marker-end="url(#dp-teal)"/>
</svg>

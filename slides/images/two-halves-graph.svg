<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive">
  <defs>
    <marker id="ah-gray" markerWidth="12" markerHeight="12" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ah-orange" markerWidth="12" markerHeight="12" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8820c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="70" text-anchor="middle" font-size="46" fill="#222">Two Halves of One Graph</text>

  <!-- Panels -->
  <rect x="55" y="150" width="720" height="690" rx="28" fill="#eef4ff" stroke="#4a90e2" stroke-width="3"/>
  <rect x="855" y="150" width="690" height="690" rx="28" fill="#e8fbf8" stroke="#2bb3a3" stroke-width="3"/>
  <text x="415" y="205" text-anchor="middle" font-size="30" fill="#2f6fd0">Structured Half &#183; Lab 1</text>
  <text x="1200" y="205" text-anchor="middle" font-size="30" fill="#1a9e8f">Unstructured Half &#183; Lab 4</text>

  <!-- ===== structured edges (gray) ===== -->
  <!-- OWNS -->
  <line x1="315" y1="315" x2="440" y2="315" stroke="#555" stroke-width="2.5" marker-end="url(#ah-gray)"/>
  <text x="378" y="303" text-anchor="middle" font-size="20" fill="#555">OWNS</text>
  <!-- OFFERS -->
  <line x1="515" y1="351" x2="372" y2="550" stroke="#555" stroke-width="2.5" marker-end="url(#ah-gray)"/>
  <text x="398" y="470" text-anchor="middle" font-size="20" fill="#555">OFFERS</text>
  <!-- FACES_RISK -->
  <line x1="572" y1="351" x2="552" y2="730" stroke="#555" stroke-width="2.5" marker-end="url(#ah-gray)"/>
  <text x="640" y="545" text-anchor="middle" font-size="20" fill="#555">FACES_RISK</text>
  <!-- COMPETES_WITH self-reference -->
  <path d="M600,340 C660,360 660,300 612,300" fill="none" stroke="#999" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="690" y="380" text-anchor="middle" font-size="19" fill="#999">COMPETES_WITH</text>

  <!-- ===== unstructured edges (gray) ===== -->
  <!-- FROM_DOCUMENT (up) -->
  <line x1="1300" y1="550" x2="1250" y2="355" stroke="#555" stroke-width="2.5" marker-end="url(#ah-gray)"/>
  <text x="1360" y="460" text-anchor="middle" font-size="20" fill="#555">FROM_DOCUMENT</text>
  <!-- NEXT_CHUNK (down) -->
  <line x1="1300" y1="626" x2="1300" y2="730" stroke="#555" stroke-width="2.5" marker-end="url(#ah-gray)"/>
  <text x="1385" y="690" text-anchor="middle" font-size="20" fill="#555">NEXT_CHUNK</text>

  <!-- ===== bridge edges (orange) ===== -->
  <!-- FILED -->
  <line x1="675" y1="315" x2="1118" y2="315" stroke="#e8820c" stroke-width="4" marker-end="url(#ah-orange)"/>
  <text x="898" y="298" text-anchor="middle" font-size="24" fill="#e8820c">FILED</text>
  <text x="898" y="336" text-anchor="middle" font-size="18" fill="#a06010">bridges the two halves</text>
  <!-- FROM_CHUNK -> Product -->
  <line x1="1185" y1="590" x2="452" y2="590" stroke="#e8820c" stroke-width="3" stroke-dasharray="12 8" marker-end="url(#ah-orange)"/>
  <text x="815" y="575" text-anchor="middle" font-size="22" fill="#e8820c">FROM_CHUNK</text>
  <!-- FROM_CHUNK -> RiskFactor -->
  <line x1="1185" y1="770" x2="667" y2="770" stroke="#e8820c" stroke-width="3" stroke-dasharray="12 8" marker-end="url(#ah-orange)"/>
  <text x="925" y="755" text-anchor="middle" font-size="22" fill="#e8820c">FROM_CHUNK</text>

  <!-- ===== nodes ===== -->
  <!-- AssetManager -->
  <rect x="85" y="279" width="230" height="72" rx="14" fill="#f4e2fb" stroke="#9b30c9" stroke-width="2.5"/>
  <path d="M119,304 L130,315 L119,326 L108,315 Z" fill="#2b6fe0" stroke="#1b4fa0" stroke-width="1.5"/>
  <text x="150" y="324" font-size="26" fill="#333">AssetManager</text>
  <!-- Company -->
  <rect x="445" y="279" width="230" height="72" rx="14" fill="#f4e2fb" stroke="#9b30c9" stroke-width="3"/>
  <path d="M479,304 L490,315 L479,326 L468,315 Z" fill="#2b6fe0" stroke="#1b4fa0" stroke-width="1.5"/>
  <text x="510" y="324" font-size="26" fill="#333">Company</text>
  <!-- Product -->
  <rect x="215" y="554" width="230" height="72" rx="14" fill="#f4e2fb" stroke="#9b30c9" stroke-width="2.5"/>
  <path d="M249,579 L260,590 L249,601 L238,590 Z" fill="#2b6fe0" stroke="#1b4fa0" stroke-width="1.5"/>
  <text x="280" y="599" font-size="26" fill="#333">Product</text>
  <!-- RiskFactor -->
  <rect x="430" y="734" width="230" height="72" rx="14" fill="#f4e2fb" stroke="#9b30c9" stroke-width="2.5"/>
  <path d="M464,759 L475,770 L464,781 L453,770 Z" fill="#2b6fe0" stroke="#1b4fa0" stroke-width="1.5"/>
  <text x="495" y="779" font-size="26" fill="#333">RiskFactor</text>

  <!-- Document -->
  <rect x="1125" y="279" width="230" height="72" rx="14" fill="#f4e2fb" stroke="#9b30c9" stroke-width="2.5"/>
  <g stroke="#c07a10" stroke-width="1.6" fill="#fffdf5">
    <path d="M1152,301 h16 l6,6 v22 h-22 Z"/>
    <path d="M1168,301 v6 h6" fill="none"/>
  </g>
  <text x="1188" y="324" font-size="26" fill="#333">Document</text>
  <!-- Chunk (mid) -->
  <rect x="1185" y="554" width="230" height="72" rx="14" fill="#f4e2fb" stroke="#9b30c9" stroke-width="2.5"/>
  <g stroke="#c07a10" stroke-width="1.6" fill="#fffdf5">
    <path d="M1212,576 h16 l6,6 v22 h-22 Z"/>
    <path d="M1228,576 v6 h6" fill="none"/>
  </g>
  <text x="1248" y="599" font-size="26" fill="#333">Chunk</text>
  <!-- Chunk (bottom) -->
  <rect x="1185" y="734" width="230" height="72" rx="14" fill="#f4e2fb" stroke="#9b30c9" stroke-width="2.5"/>
  <g stroke="#c07a10" stroke-width="1.6" fill="#fffdf5">
    <path d="M1212,756 h16 l6,6 v22 h-22 Z"/>
    <path d="M1228,756 v6 h6" fill="none"/>
  </g>
  <text x="1248" y="779" font-size="26" fill="#333">Chunk</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ah-gray" markerWidth="12" markerHeight="12" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="ah-orange" markerWidth="12" markerHeight="12" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#101828" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="70" text-anchor="middle" font-size="46" font-weight="600" letter-spacing="0.3" fill="#1e293b">Two Halves of One Graph</text>

  <!-- Panels -->
  <rect x="55" y="150" width="720" height="690" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="855" y="150" width="690" height="690" rx="18" fill="#ecfeff" stroke="#a5f3fc" stroke-width="2"/>
  <text x="415" y="205" text-anchor="middle" font-size="30" font-weight="600" fill="#1d4ed8">Structured Half &#183; Lab 1</text>
  <text x="1200" y="205" text-anchor="middle" font-size="30" font-weight="600" fill="#0e7490">Unstructured Half &#183; Lab 3</text>

  <!-- ===== structured edges (gray) ===== -->
  <!-- OWNS -->
  <line x1="315" y1="315" x2="440" y2="315" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="378" y="303" text-anchor="middle" font-size="20" letter-spacing="0.3" fill="#64748b">OWNS</text>
  <!-- OFFERS -->
  <line x1="500" y1="351" x2="275" y2="552" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="340" y="450" text-anchor="middle" font-size="20" letter-spacing="0.3" fill="#64748b">OFFERS</text>
  <!-- FACES_RISK -->
  <line x1="480" y1="351" x2="250" y2="731" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="432" y="548" text-anchor="middle" font-size="20" letter-spacing="0.3" fill="#64748b">FACES_RISK</text>
  <!-- REPORTS -->
  <line x1="560" y1="351" x2="556" y2="642" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="602" y="500" text-anchor="middle" font-size="20" letter-spacing="0.3" fill="#64748b">REPORTS</text>
  <!-- COMPETES_WITH / PARTNERS_WITH self-reference -->
  <path d="M600,340 C660,360 660,300 612,300" fill="none" stroke="#cbd5e1" stroke-width="1.75" marker-end="url(#ah-gray)"/>
  <text x="650" y="398" text-anchor="middle" font-size="18" fill="#94a3b8">COMPETES_WITH /</text>
  <text x="650" y="418" text-anchor="middle" font-size="18" fill="#94a3b8">PARTNERS_WITH</text>

  <!-- ===== unstructured edges (gray) ===== -->
  <!-- FROM_DOCUMENT (up) -->
  <line x1="1300" y1="550" x2="1250" y2="355" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="1360" y="460" text-anchor="middle" font-size="20" letter-spacing="0.3" fill="#64748b">FROM_DOCUMENT</text>
  <!-- NEXT_CHUNK (down) -->
  <line x1="1300" y1="626" x2="1300" y2="730" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-gray)"/>
  <text x="1385" y="690" text-anchor="middle" font-size="20" letter-spacing="0.3" fill="#64748b">NEXT_CHUNK</text>

  <!-- ===== bridge edges (orange) ===== -->
  <!-- FILED -->
  <line x1="675" y1="315" x2="1118" y2="315" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ah-orange)"/>
  <text x="898" y="298" text-anchor="middle" font-size="24" font-weight="600" letter-spacing="0.3" fill="#b45309">FILED</text>
  <text x="898" y="336" text-anchor="middle" font-size="18" fill="#d97706">bridges the two halves</text>
  <!-- FROM_CHUNK: (Product)-[:FROM_CHUNK]->(Chunk) -->
  <line x1="306" y1="590" x2="1179" y2="590" stroke="#f59e0b" stroke-width="2" stroke-dasharray="12 8" marker-end="url(#ah-orange)"/>
  <text x="720" y="575" text-anchor="middle" font-size="22" font-weight="600" letter-spacing="0.3" fill="#b45309">FROM_CHUNK</text>
  <!-- FROM_CHUNK: (RiskFactor)-[:FROM_CHUNK]->(Chunk) -->
  <line x1="306" y1="770" x2="1179" y2="770" stroke="#f59e0b" stroke-width="2" stroke-dasharray="12 8" marker-end="url(#ah-orange)"/>
  <text x="850" y="755" text-anchor="middle" font-size="22" font-weight="600" letter-spacing="0.3" fill="#b45309">FROM_CHUNK</text>

  <!-- ===== nodes ===== -->
  <!-- AssetManager -->
  <rect x="85" y="279" width="230" height="72" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.75" filter="url(#shadow)"/>
  <path d="M119,304 L130,315 L119,326 L108,315 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.25"/>
  <text x="150" y="324" font-size="26" font-weight="600" fill="#5b21b6">AssetManager</text>
  <!-- Company -->
  <rect x="445" y="279" width="230" height="72" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <path d="M479,304 L490,315 L479,326 L468,315 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.25"/>
  <text x="510" y="324" font-size="26" font-weight="600" fill="#5b21b6">Company</text>
  <!-- Product -->
  <rect x="90" y="554" width="210" height="72" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.75" filter="url(#shadow)"/>
  <path d="M124,579 L135,590 L124,601 L113,590 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.25"/>
  <text x="155" y="599" font-size="26" font-weight="600" fill="#5b21b6">Product</text>
  <!-- FinancialMetric -->
  <rect x="430" y="644" width="250" height="72" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.75" filter="url(#shadow)"/>
  <path d="M464,669 L475,680 L464,691 L453,680 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.25"/>
  <text x="495" y="689" font-size="24" font-weight="600" fill="#5b21b6">FinancialMetric</text>
  <!-- RiskFactor -->
  <rect x="90" y="734" width="210" height="72" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.75" filter="url(#shadow)"/>
  <path d="M124,759 L135,770 L124,781 L113,770 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.25"/>
  <text x="155" y="779" font-size="26" font-weight="600" fill="#5b21b6">RiskFactor</text>

  <!-- Document -->
  <rect x="1125" y="279" width="230" height="72" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.75" filter="url(#shadow)"/>
  <g stroke="#a16207" stroke-width="1.6" fill="#fffbeb">
    <path d="M1152,301 h16 l6,6 v22 h-22 Z"/>
    <path d="M1168,301 v6 h6" fill="none"/>
  </g>
  <text x="1188" y="324" font-size="26" font-weight="600" fill="#5b21b6">Document</text>
  <!-- Chunk (mid) -->
  <rect x="1185" y="554" width="230" height="72" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.75" filter="url(#shadow)"/>
  <g stroke="#a16207" stroke-width="1.6" fill="#fffbeb">
    <path d="M1212,576 h16 l6,6 v22 h-22 Z"/>
    <path d="M1228,576 v6 h6" fill="none"/>
  </g>
  <text x="1248" y="599" font-size="26" font-weight="600" fill="#5b21b6">Chunk</text>
  <!-- Chunk (bottom) -->
  <rect x="1185" y="734" width="230" height="72" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.75" filter="url(#shadow)"/>
  <g stroke="#a16207" stroke-width="1.6" fill="#fffbeb">
    <path d="M1212,756 h16 l6,6 v22 h-22 Z"/>
    <path d="M1228,756 v6 h6" fill="none"/>
  </g>
  <text x="1248" y="779" font-size="26" font-weight="600" fill="#5b21b6">Chunk</text>
</svg>

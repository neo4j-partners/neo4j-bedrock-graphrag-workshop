<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1380" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive">
  <defs>
    <marker id="fm-blue" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker>
    <marker id="fm-orange" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
    <marker id="fm-red" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker>
    <marker id="fm-purple" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9c36b5"/></marker>
    <marker id="fm-teal" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0c8599"/></marker>
    <marker id="fm-gray" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#adb5bd"/></marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1380" fill="#ffffff"/>

  <text x="800" y="60" text-anchor="middle" font-size="42" fill="#222">SEC 10-K Financial Data Model</text>

  <!-- band labels -->
  <text x="55" y="150" font-size="24" fill="#adb5bd">STRUCTURED LAYER (CSV seed data)</text>
  <line x1="40" y1="860" x2="1560" y2="860" stroke="#dee2e6" stroke-width="2" stroke-dasharray="10 10"/>
  <text x="55" y="915" font-size="24" fill="#adb5bd">CROSS-LINK (Company &#8594; Document via FILED)</text>
  <line x1="40" y1="1090" x2="1560" y2="1090" stroke="#dee2e6" stroke-width="2" stroke-dasharray="10 10"/>
  <text x="55" y="1145" font-size="24" fill="#adb5bd">UNSTRUCTURED LAYER (SimpleKGPipeline from PDFs)</text>

  <!-- ===== structured-layer edges ===== -->
  <!-- OWNS -->
  <line x1="362" y1="240" x2="766" y2="240" stroke="#e8590c" stroke-width="3" marker-end="url(#fm-orange)"/>
  <text x="560" y="228" text-anchor="middle" font-size="22" fill="#e8590c">OWNS</text>
  <!-- OFFERS -->
  <line x1="1112" y1="235" x2="1296" y2="248" stroke="#1971c2" stroke-width="3" marker-end="url(#fm-blue)"/>
  <text x="1210" y="222" text-anchor="middle" font-size="22" fill="#1971c2">OFFERS</text>
  <!-- FACES_RISK -->
  <line x1="1112" y1="268" x2="1296" y2="400" stroke="#1971c2" stroke-width="3" marker-end="url(#fm-blue)"/>
  <text x="1230" y="378" text-anchor="middle" font-size="22" fill="#1971c2">FACES_RISK</text>
  <!-- Company -> Executive -->
  <line x1="1112" y1="283" x2="1296" y2="560" stroke="#1971c2" stroke-width="3" marker-end="url(#fm-blue)"/>
  <!-- Company -> FinancialMetric -->
  <line x1="1112" y1="290" x2="1296" y2="715" stroke="#1971c2" stroke-width="3" marker-end="url(#fm-blue)"/>
  <!-- COMPETES / PARTNERS self loop -->
  <path d="M905,300 C845,330 845,265 895,258" fill="none" stroke="#adb5bd" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#fm-gray)"/>
  <text x="960" y="360" text-anchor="middle" font-size="21" fill="#adb5bd">COMPETES / PARTNERS</text>
  <!-- FILED (long vertical, red) -->
  <line x1="940" y1="300" x2="940" y2="976" stroke="#e03131" stroke-width="3.5" marker-end="url(#fm-red)"/>
  <text x="1000" y="640" text-anchor="middle" font-size="24" fill="#e03131">FILED</text>

  <!-- ===== structured-layer nodes ===== -->
  <!-- AssetManager -->
  <rect x="60" y="200" width="300" height="80" rx="16" fill="#ffe8cc" stroke="#e8590c" stroke-width="2.5"/>
  <text x="210" y="250" text-anchor="middle" font-size="27" fill="#e8590c">AssetManager</text>
  <!-- Company (hero) -->
  <rect x="770" y="200" width="340" height="92" rx="16" fill="#dbe4ff" stroke="#1971c2" stroke-width="3"/>
  <path d="M842,236 L858,246 L842,256 L826,246 Z" fill="#2b6fe0" stroke="#1b4fa0" stroke-width="1.5"/>
  <text x="960" y="256" text-anchor="middle" font-size="28" fill="#1971c2">Company</text>
  <!-- Product -->
  <rect x="1300" y="210" width="280" height="80" rx="16" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2.5"/>
  <text x="1440" y="260" text-anchor="middle" font-size="27" fill="#2f9e44">Product</text>
  <!-- RiskFactor -->
  <rect x="1300" y="370" width="280" height="80" rx="16" fill="#fff9db" stroke="#f08c00" stroke-width="2.5"/>
  <text x="1450" y="420" text-anchor="middle" font-size="27" fill="#e67700">RiskFactor</text>
  <!-- Executive -->
  <rect x="1300" y="520" width="280" height="80" rx="16" fill="#c5f6fa" stroke="#1098ad" stroke-width="2.5"/>
  <text x="1450" y="570" text-anchor="middle" font-size="27" fill="#0c8599">Executive</text>
  <!-- FinancialMetric -->
  <rect x="1300" y="670" width="280" height="80" rx="16" fill="#c5f6fa" stroke="#1098ad" stroke-width="2.5"/>
  <text x="1440" y="720" text-anchor="middle" font-size="25" fill="#0c8599">FinancialMetric</text>

  <!-- ===== cross-link node ===== -->
  <rect x="770" y="960" width="340" height="92" rx="16" fill="#f3e8fd" stroke="#9c36b5" stroke-width="3"/>
  <g stroke="#c07a10" stroke-width="1.8" fill="#fffdf5"><path d="M852,986 h18 l7,7 v26 h-25 Z"/><path d="M870,986 v7 h7" fill="none"/></g>
  <text x="965" y="1016" text-anchor="middle" font-size="28" fill="#9c36b5">Document</text>

  <!-- ===== unstructured-layer edges ===== -->
  <!-- FROM_DOCUMENT (Chunk -> Document) -->
  <line x1="940" y1="1176" x2="940" y2="1056" stroke="#9c36b5" stroke-width="3" marker-end="url(#fm-purple)"/>
  <text x="940" y="1128" text-anchor="middle" font-size="21" fill="#9c36b5">FROM_DOCUMENT</text>
  <!-- FROM_CHUNK (Extracted Entity -> Chunk) -->
  <line x1="442" y1="1225" x2="766" y2="1225" stroke="#0c8599" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#fm-teal)"/>
  <text x="600" y="1210" text-anchor="middle" font-size="21" fill="#0c8599">FROM_CHUNK</text>
  <!-- NEXT_CHUNK (Chunk -> Chunk) -->
  <line x1="1112" y1="1225" x2="1326" y2="1225" stroke="#9c36b5" stroke-width="3" marker-end="url(#fm-purple)"/>
  <text x="1220" y="1210" text-anchor="middle" font-size="21" fill="#9c36b5">NEXT_CHUNK</text>

  <!-- ===== unstructured-layer nodes ===== -->
  <!-- Chunk (center) -->
  <rect x="770" y="1180" width="340" height="92" rx="16" fill="#f3e8fd" stroke="#9c36b5" stroke-width="2.5"/>
  <text x="960" y="1214" text-anchor="middle" font-size="25" fill="#9c36b5">Chunk</text>
  <text x="960" y="1246" text-anchor="middle" font-size="20" fill="#9c36b5">(text, embedding)</text>
  <!-- Extracted Entity (dashed teal) -->
  <rect x="140" y="1180" width="300" height="92" rx="16" fill="#c5f6fa" stroke="#1098ad" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="290" y="1214" text-anchor="middle" font-size="24" fill="#0c8599">Extracted Entity</text>
  <text x="290" y="1246" text-anchor="middle" font-size="20" fill="#0c8599">(provenance)</text>
  <!-- Chunk (right) -->
  <rect x="1330" y="1180" width="250" height="92" rx="16" fill="#f3e8fd" stroke="#9c36b5" stroke-width="2.5"/>
  <text x="1455" y="1232" text-anchor="middle" font-size="25" fill="#9c36b5">Chunk</text>

  <!-- ===== key path footer ===== -->
  <rect x="150" y="1300" width="1300" height="62" rx="16" fill="#ffec99" stroke="#f08c00" stroke-width="2.5"/>
  <text x="800" y="1339" text-anchor="middle" font-size="22" fill="#8a5a00">Key Path:  (:Chunk)-[:FROM_DOCUMENT]-&gt;(:Document)&lt;-[:FILED]-(:Company)-[:FACES_RISK]-&gt;(:RiskFactor)</text>
</svg>

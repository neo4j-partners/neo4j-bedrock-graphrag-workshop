<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1480" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ge-dark" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="ge-teal" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#06b6d4"/></marker>
    <marker id="ge-purple" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#101828" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1500" height="1480" fill="#ffffff"/>

  <text x="750" y="64" text-anchor="middle" font-size="42" font-weight="600" letter-spacing="0.3" fill="#1e293b">SEC 10-K GraphRAG Retrieval Flow</text>
  <text x="370" y="150" text-anchor="middle" font-size="24" font-weight="600" fill="#94a3b8">Retrieval Pipeline</text>
  <text x="1105" y="150" text-anchor="middle" font-size="24" font-weight="600" fill="#94a3b8">Neo4j Knowledge Graph</text>

  <!-- ===== left column flow arrows ===== -->
  <line x1="370" y1="295" x2="370" y2="356" stroke="#94a3b8" stroke-width="2.25" marker-end="url(#ge-dark)"/>
  <line x1="370" y1="455" x2="370" y2="516" stroke="#94a3b8" stroke-width="2.25" marker-end="url(#ge-dark)"/>
  <line x1="370" y1="635" x2="370" y2="696" stroke="#94a3b8" stroke-width="2.25" marker-end="url(#ge-dark)"/>
  <line x1="370" y1="795" x2="370" y2="856" stroke="#94a3b8" stroke-width="2.25" marker-end="url(#ge-dark)"/>

  <!-- ===== right column flow arrows ===== -->
  <line x1="1105" y1="360" x2="1105" y2="416" stroke="#94a3b8" stroke-width="2.25" marker-end="url(#ge-dark)"/>
  <line x1="1105" y1="520" x2="1105" y2="576" stroke="#94a3b8" stroke-width="2.25" marker-end="url(#ge-dark)"/>
  <line x1="1105" y1="720" x2="1105" y2="776" stroke="#94a3b8" stroke-width="2.25" marker-end="url(#ge-dark)"/>
  <line x1="1105" y1="890" x2="1105" y2="946" stroke="#94a3b8" stroke-width="2.25" marker-end="url(#ge-dark)"/>

  <!-- ===== cross links ===== -->
  <!-- Vector/Hybrid Search -> Chunk nodes -->
  <line x1="650" y1="405" x2="798" y2="300" stroke="#06b6d4" stroke-width="2.25" marker-end="url(#ge-teal)"/>
  <!-- Graph Traversal -> Company -->
  <line x1="650" y1="575" x2="798" y2="650" stroke="#8b5cf6" stroke-width="2.25" stroke-dasharray="11 7" marker-end="url(#ge-purple)"/>

  <!-- ===== left column boxes ===== -->
  <rect x="90" y="200" width="560" height="95" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="370" y="256" text-anchor="middle" font-size="28" font-weight="600" fill="#1d4ed8">User Question</text>

  <rect x="90" y="360" width="560" height="95" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="370" y="416" text-anchor="middle" font-size="28" font-weight="600" fill="#0e7490">Vector / Hybrid Search</text>

  <rect x="90" y="520" width="560" height="115" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="370" y="568" text-anchor="middle" font-size="27" font-weight="600" fill="#6d28d9">Graph Traversal</text>
  <text x="370" y="602" text-anchor="middle" font-size="23" fill="#7c3aed">(VectorCypherRetriever)</text>

  <rect x="90" y="700" width="560" height="95" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="370" y="756" text-anchor="middle" font-size="28" font-weight="600" fill="#15803d">Graph-Enriched Context</text>

  <rect x="90" y="860" width="560" height="95" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="370" y="916" text-anchor="middle" font-size="28" font-weight="600" fill="#15803d">GraphRAG Answer</text>

  <!-- ===== right column boxes ===== -->
  <rect x="800" y="200" width="610" height="160" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="1105" y="256" text-anchor="middle" font-size="27" font-weight="600" fill="#b45309">(:Chunk) Nodes</text>
  <text x="1105" y="292" text-anchor="middle" font-size="24" fill="#d97706">Vector + Fulltext Indexed</text>
  <text x="1105" y="326" text-anchor="middle" font-size="24" fill="#d97706">NEXT_CHUNK chain</text>

  <rect x="800" y="420" width="610" height="100" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="1105" y="462" text-anchor="middle" font-size="27" font-weight="600" fill="#0e7490">(:Document)</text>
  <text x="1105" y="496" text-anchor="middle" font-size="24" fill="#0891b2">FROM_DOCUMENT</text>

  <rect x="800" y="580" width="610" height="140" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="1105" y="628" text-anchor="middle" font-size="27" font-weight="600" fill="#6d28d9">(:Company)</text>
  <text x="1105" y="662" text-anchor="middle" font-size="24" fill="#7c3aed">FILED / COMPETES_WITH /</text>
  <text x="1105" y="694" text-anchor="middle" font-size="24" fill="#7c3aed">PARTNERS_WITH</text>

  <rect x="800" y="780" width="610" height="110" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="1105" y="826" text-anchor="middle" font-size="27" font-weight="600" fill="#be123c">(:Product) (:RiskFactor)</text>
  <text x="1105" y="860" text-anchor="middle" font-size="24" fill="#e11d48">OFFERS / FACES_RISK</text>

  <rect x="800" y="950" width="610" height="110" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="1105" y="996" text-anchor="middle" font-size="27" font-weight="600" fill="#b45309">(:AssetManager)</text>
  <text x="1105" y="1030" text-anchor="middle" font-size="24" fill="#d97706">OWNS {shares}</text>

  <!-- ===== framework footer ===== -->
  <rect x="60" y="1360" width="1380" height="72" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.75" filter="url(#shadow)"/>
  <text x="750" y="1404" text-anchor="middle" font-size="23" font-weight="500" fill="#92400e">neo4j-graphrag  |  VectorRetriever  |  VectorCypherRetriever  |  HybridRetriever  |  Bedrock Titan Text Embeddings V2</text>
</svg>
